<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ebook Search</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <main>
    <h1>Ebook Search</h1>
    <form hx-get="/search" hx-target="#results" hx-trigger="input changed delay:300ms, submit">
      <input type="search" name="q" placeholder="Suche..." autofocus>
    </form>
    <div id="results"></div>
  </main>
</body>
</html>

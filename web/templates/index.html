<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elektro-Buch</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Elektro-Buch</h1>
      <div class="header-meta">
        <p class="total-count">{{.TotalCount}} Bücher</p>
        <a href="/suggestions" class="list-link">Vorschläge</a>
        <a href="/list" class="list-link" id="list-count">Merkliste{{if gt .ListCount 0}} ({{.ListCount}}){{end}}</a>
        <a href="/stats" class="list-link">Statistiken</a>
      </div>
    </header>
    <div class="search-wrap">
      <input
        id="q-input"
        type="search"
        name="q"
        placeholder="Titel oder Autor suchen…"
        autofocus
        autocomplete="off"
        hx-get="/search"
        hx-target="#results"
        hx-trigger="input changed delay:200ms, search"
        hx-include="#genre-input"
      >
      <input
        id="genre-input"
        type="search"
        name="genre"
        placeholder="Genre filtern…"
        autocomplete="off"
        list="genres-list"
        hx-get="/search"
        hx-target="#results"
        hx-trigger="input changed delay:200ms, search, change"
        hx-include="#q-input"
      >
      <datalist id="genres-list">
        {{range .Genres}}<option value="{{.}}">{{end}}
      </datalist>
    </div>
    <div id="results">
      {{template "results" .}}
    </div>
  </div>
  <div id="detail-container"></div>
</body>
</html>

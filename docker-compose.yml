services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ebook:ebook@postgres:5432/ebook_search?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ebook

  classify:
    build: .
    command: ["./classify"]
    environment:
      DATABASE_URL: postgres://ebook:ebook@postgres:5432/ebook_search?sslmode=disable
      OLLAMA_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - ebook
    profiles: ["classify"]

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ebook
      POSTGRES_PASSWORD: ebook
      POSTGRES_DB: ebook_search
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebook -d ebook_search"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ebook

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ebook
    profiles: ["classify"]

volumes:
  ollama_data:

networks:
  ebook:
